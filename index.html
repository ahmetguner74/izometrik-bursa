<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f8f1"><title>İzometrik Bursa | Ulu Cami</title><style>
*{box-sizing:border-box}body{margin:0;color:#244538;font:15px system-ui,sans-serif;background:#e9ece5}header{position:absolute;top:16px;left:16px;z-index:2;padding:12px 17px;border:1px solid #d0ddce;border-radius:12px;background:#fffef7ed;pointer-events:none}h1{font-size:19px;line-height:1.2;margin:0}header small{display:block;margin-top:4px;color:#64776b}#view{height:100dvh;overflow:hidden;touch-action:none;cursor:grab}#world{position:absolute;left:0;top:0;width:1536px;height:1536px;transform-origin:0 0}img{display:block;width:100%;height:100%;user-select:none;pointer-events:none}.grid{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(to right,transparent calc(100% - 2px),#ed593b calc(100% - 2px)),linear-gradient(to bottom,transparent calc(100% - 2px),#ed593b calc(100% - 2px));background-size:512px 512px}.controls{position:absolute;right:16px;bottom:20px;display:flex;flex-direction:column;gap:6px}button{min-width:44px;min-height:44px;border:1px solid #cbd9c9;border-radius:8px;background:#fffef7;color:#244538;font:20px system-ui;cursor:pointer}#frames{font-size:13px}button:focus-visible{outline:3px solid #25836c;outline-offset:2px}.label{position:absolute;bottom:20px;left:16px;max-width:220px;padding:10px 12px;background:#fffef7e8;border:1px solid #d0ddce;border-radius:8px;font-size:12px;color:#526a5b;pointer-events:none}@media(max-width:500px){header{top:10px;left:10px}h1{font-size:17px}.controls{right:10px;bottom:12px}.label{bottom:12px;left:10px;max-width:195px}}
</style></head><body><header><h1>İzometrik Bursa</h1><small>Ulu Cami ve çevresi · çizim haritası</small></header><main id="view" aria-label="Ulu Cami çizim haritası"><div id="world"><img src="ulucami.webp" alt="Ulu Cami ve çevresinin izometrik çizimi" draggable="false"><div id="grid" class="grid" hidden></div></div></main><div class="label">Yerel çalışma · çizim amaçlıdır, ölçüm verisi değildir.</div><div class="controls"><button id="plus" aria-label="Yakınlaştır">+</button><button id="minus" aria-label="Uzaklaştır">−</button><button id="reset" aria-label="Haritayı ortala">⌂</button><button id="frames" aria-pressed="false">Kareler</button></div><script>
const v=document.querySelector('#view'),w=document.querySelector('#world'),grid=document.querySelector('#grid'),f=document.querySelector('#frames');let s=1,x=0,y=0;const pts=new Map();let last=null;function draw(){w.style.transform=`translate(${x}px,${y}px) scale(${s})`}function reset(){s=Math.min(innerWidth,innerHeight)/1536*.88;x=(innerWidth-1536*s)/2;y=(innerHeight-1536*s)/2;draw()}function zoom(factor,cx,cy){const n=Math.max(.08,Math.min(4,s*factor));x=cx-(cx-x)*n/s;y=cy-(cy-y)*n/s;s=n;draw()}function gesture(){const a=[...pts.values()];if(a.length===1)return {x:a[0].x,y:a[0].y,d:0};if(a.length>=2)return{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2,d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)};return null}v.addEventListener('pointerdown',e=>{pts.set(e.pointerId,{x:e.clientX,y:e.clientY});v.setPointerCapture(e.pointerId);last=gesture();v.style.cursor='grabbing'});v.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});let g=gesture();if(last&&g){x+=g.x-last.x;y+=g.y-last.y;if(g.d&&last.d)zoom(g.d/last.d,g.x,g.y);else draw()}last=g});function end(e){pts.delete(e.pointerId);last=gesture();v.style.cursor='grab'}v.addEventListener('pointerup',end);v.addEventListener('pointercancel',end);v.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});document.querySelector('#plus').onclick=()=>zoom(1.3,innerWidth/2,innerHeight/2);document.querySelector('#minus').onclick=()=>zoom(1/1.3,innerWidth/2,innerHeight/2);document.querySelector('#reset').onclick=reset;f.onclick=()=>{grid.hidden=!grid.hidden;f.setAttribute('aria-pressed',String(!grid.hidden))};reset();
</script></body></html>
